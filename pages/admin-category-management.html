<!DOCTYPE html>
<html lang="vi" data-page="admin-category-management">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục | CareRoute</title>

      <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="app-shell">
        <header class="app-header">
          <a class="brand" href="admin-dashboard.html" aria-label="CareRoute - Bảng điều khiển">
            <span class="brand-mark" aria-hidden="true">+</span>
            <span>CareRoute</span>
          </a>
          <div class="topbar-actions">
            <button class="notification-button" type="button" aria-label="Thông báo">
              <img src="../assets/icons/notification-bell-alert-alarm-clock-time-watch-svgrepo-com.svg" alt="" />
            </button>
            <div class="user-card">
              <img class="user-avatar" src="../assets/images/anh_bac_si.png" alt="" />
              <div>
                <div class="user-name">Minh Quý</div>
                <span class="user-role">Điều Phối Viên</span>
              </div>
            </div>
          </div>
        </header>

        <div class="app-body">
          <aside class="sidebar" aria-label="Điều hướng quản trị">
            <p class="sidebar-label">HỆ THỐNG QUẢN TRỊ</p>
            <nav class="nav-list">
              <a class="nav-item" href="admin-dashboard.html">
                <span class="nav-icon" aria-hidden="true"><img src="../assets/icons/layout-grid-1-svgrepo-com.svg" alt="" /></span>
                <span>Bảng điều khiển</span>
              </a>
              <a class="nav-item" href="admin-facility-management.html">
                <span class="nav-icon" aria-hidden="true"><img src="../assets/icons/briefcase-svgrepo-com.svg" alt="" /></span>
                <span>Quản lý cơ sở</span>
              </a>
              <a class="nav-item active" href="admin-category-management.html" aria-current="page">
                <span class="nav-icon" aria-hidden="true"><img src="../assets/icons/map-svgrepo-com.svg" alt="" /></span>
                <span>Quản lý danh mục</span>
              </a>
              <a class="nav-item" href="#settings">
                <span class="nav-icon" aria-hidden="true"><img src="../assets/icons/settings-svgrepo-com.svg" alt="" /></span>
                <span>Cài đặt hệ thống</span>
              </a>
            </nav>
          </aside>

          <main class="main-panel">
            <div class="content-heading">
              <div>
                <h1>Quản lý Danh mục phân loại y tế</h1>
                <p>Cấu trúc hóa các chuyên khoa và phân ngành dịch vụ giúp tối ưu hóa thuật toán AI</p>
              </div>
              <button class="button button-primary" id="add-category-button" type="button">Thêm danh mục</button>
            </div>

            <div class="category-layout">
              <section class="card" aria-labelledby="tree-heading">
                <h2 id="tree-heading">Cấu trúc chuyên khoa</h2>
                <div class="tree-list" id="category-tree" aria-live="polite"></div>
              </section>

              <section class="card" aria-labelledby="form-heading">
                <h2 id="form-heading">Chi tiết Danh mục chỉnh sửa</h2>
                <form id="category-form" novalidate>
                  <div class="form-field">
                    <label for="category-name">Tên Danh Mục</label>
                    <input id="category-name" name="name" type="text" maxlength="80" required />
                  </div>
                  <div class="form-field">
                    <label for="category-description">Mô tả chi tiết</label>
                    <textarea id="category-description" name="description" maxlength="300" rows="3"></textarea>
                  </div>
                  <div class="form-field">
                    <label for="category-parent">Danh mục chính</label>
                    <select id="category-parent" name="parentId">
                      <option value="">Không có (danh mục cha)</option>
                    </select>
                  </div>
                  <p class="form-message" id="form-message" role="alert"></p>
                  <div class="form-actions">
                    <button class="button button-secondary" id="cancel-edit-button" type="button">Hủy</button>
                    <button class="button button-primary" id="save-category-button" type="submit">Lưu Thay Đổi</button>
                  </div>
                </form>
              </section>
            </div>
          </main>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>


    <script src="../js/main.js" defer></script>
</body>
</html>
